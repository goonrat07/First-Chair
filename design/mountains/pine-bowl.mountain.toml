# Pine Bowl: a small second mountain, made only with the mountain tool (story 015) to prove the format.
# Build:   python3 tools/mountain/mountain.py build design/mountains/pine-bowl.mountain.toml
# Preview: python3 tools/mountain/mountain.py preview design/mountains/pine-bowl.mountain.toml
# Check:   python3 tools/mountain/mountain.py check design/mountains/pine-bowl.mountain.toml
# The format, field by field: tools/mountain/README.md. Positions are metres on the map: x across, z down the fall line
# from the summit side (z = 0) toward the base.
#
# A bowl half the test mountain's size: a blue down its middle, a red along the east spine, a green cat track
# switching back across the west face past a gully, a knoll with a powder stash between the runs, and a chairlift
# that climbs at an angle from the base's west side to the summit.

format = 1
name = "PineBowl"
title = "Pine Bowl"
start_m = [266.0, 40.0]

[grid]
resolution = 1025                     # 0.5 m a sample over 512 m
size_m = 512.0
max_height_m = 200.0

[profile]
base_height_m = 6.0
gradient = [
    [0.0, 0.03], [36.0, 0.05], [80.0, 0.38], [280.0, 0.38], [350.0, 0.24], [430.0, 0.05], [470.0, 0.0],
    [512.0, 0.0],
]

[peak]
drop_m = 26.0
fade_z_m = [40.0, 220.0]

[ridges]
rise_m = 22.0
start_off_centre_m = 150.0
width_m = 90.0
fade_z_m = [110.0, 300.0]

[noise]
layers = [
    { spacing_m = 64.0, amplitude_m = 3.0, seed = 31 },
    { spacing_m = 24.0, amplitude_m = 0.9, seed = 32 },
]

[[features]]                          # a gully down the west face, which the cat track crosses
kind = "valley"
points_m = [[118.0, 110.0], [104.0, 210.0], [122.0, 330.0]]
width_m = 44.0
depth_m = 6.0

[[features]]                          # the east spine the red follows
kind = "ridge"
points_m = [[392.0, 110.0], [410.0, 250.0], [396.0, 360.0]]
width_m = 70.0
height_m = 8.0

[[features]]                          # a knoll between the blue and the red, its powder left ungroomed
kind = "hill"
centre_m = [336.0, 250.0]
radius_m = 42.0
height_m = 7.0

[[features]]                          # a level lookout on the west shoulder, for a hut one day
kind = "flatten"
centre_m = [190.0, 300.0]
radius_m = 12.0
blend_m = 16.0

[summit]
centre_m = [256.0, 30.0]
radius_m = 26.0
blend_m = 30.0
noise_free_m = [36.0, 90.0]

[base]
area_m = [130.0, 440.0, 382.0, 512.0]
blend_m = 18.0

[tree_line]
height_m = 120.0
spread_m = 12.0

[[runs]]
name = "bowl-run"
difficulty = "blue"
width_m = 34.0
points_m = [[262.0, 46.0], [296.0, 120.0], [288.0, 220.0], [264.0, 320.0], [252.0, 400.0], [254.0, 474.0]]

[[runs]]
name = "spine"
difficulty = "red"
width_m = 26.0
points_m = [[276.0, 42.0], [372.0, 92.0], [404.0, 190.0], [400.0, 300.0], [358.0, 400.0], [304.0, 474.0]]

[[runs]]
name = "west-traverse"
difficulty = "green"
width_m = 10.0
shape = "cat"
points_m = [
    [244.0, 46.0], [180.0, 62.0], [96.0, 92.0], [78.0, 122.0], [130.0, 152.0], [220.0, 190.0], [236.0, 214.0],
    [210.0, 236.0], [110.0, 268.0], [86.0, 300.0], [140.0, 340.0], [212.0, 390.0], [224.0, 474.0],
]

[snow]
background = "crud"
above_tree_line = "powder"

[[snow.areas]]                        # the knoll's powder stash
snow = "powder"
circle_m = [336.0, 250.0, 26.0]

[[snow.areas]]                        # wet snow where riders queue for the lift
snow = "slush"
rect_m = [172.0, 470.0, 228.0, 498.0]

[[lifts]]
name = "pine-chair"
bottom_m = [200.0, 486.0]
top_m = [236.0, 34.0]

[trees]
seed = 5
glades = [
    { area_m = [300.0, 300.0, 350.0, 420.0], keep_per_mille = 360 },
]
