# Runs the riding sim's tests (Story 001) on every push and pull request.
# Needs only the .NET SDK: no Unity install or license. A failing test fails the run.
# Actions are pinned to full commit SHAs; the tag each SHA was taken from is in the comment.
name: sim-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim-tests:
    name: dotnet test sim/
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TestSlopeTests (Story 003) read the generated test-slope heightmap and snow map
          # (Assets/Terrain/TestSlope/*.raw), which live in Git LFS.
          lfs: true

      - name: Set up the .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Run the sim tests
        run: dotnet test sim/
